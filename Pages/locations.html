<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations | Apex Burger</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="location-body">

    <header class="navbar">
        <div class="logo">APEX<span>BURGER</span></div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="locations.html">Locations</a></li>
                <li><a href="#" class="btn-nav">Order Now</a></li>
            </ul>
        </nav>
    </header>

    <div class="location-wrapper">
        <aside class="location-sidebar">
            <div class="sidebar-header">
                <h2>Our Branches</h2>
                <input type="text" placeholder="Search Karachi..." class="search-bar">
            </div>
            <div class="location-scroll">
                <div class="loc-card active">
                    <h4>Clifton, Karachi</h4>
                    <p>Marine Promenade, Block 4</p>
                    <span class="status">Open Now</span>
                </div>
                <div class="loc-card">
                    <h4>DHA Phase 6</h4>
                    <p>Shahbaz Commercial Area</p>
                    <span class="status">Open Now</span>
                </div>
            </div>
        </aside>
        <main class="map-view">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14481.54!2d67.0256!3d24.8512!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33e70a31f45a9%3A0x25e253e037148d21!2sKarachi!5e0!3m2!1sen!2s!4v1715000000000" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </main>
    </div>

</body>
